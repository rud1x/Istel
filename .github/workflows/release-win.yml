name: Release Windows Installer

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build renderer
        run: npm run build

      - name: Build installer
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Determine Tag
        id: tag_name
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v1.0.2" >> $GITHUB_OUTPUT
          fi

      - name: Upload EXE to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view ${{ steps.tag_name.outputs.TAG }} > /dev/null 2>&1; then
            gh release create ${{ steps.tag_name.outputs.TAG }} --draft --title "Release ${{ steps.tag_name.outputs.TAG }}" --generate-notes
            sleep 5
          fi
          gh release upload ${{ steps.tag_name.outputs.TAG }} dist-electron/*.exe dist-electron/latest.yml dist-electron/*.blockmap --clobber
